<script>
    // URL se link parameter read karega (e.g. viewer.html?target=https://pwthor.live/...)
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('target') || "https://pwthor.live/study/batches";
    
    // Redirect logic
    setTimeout(() => {
        window.location.replace(targetUrl);
    }, 1000);
</script>
